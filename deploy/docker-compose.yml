# Runs on the Vultr VM: the app + Caddy (automatic HTTPS for the GoDaddy domain). Owner: B.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env.production # keys live only on the server, never in git
    expose: ["3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. eazyroam.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
